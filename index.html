<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Icons.

         favicon.svg is deliberately NOT referenced: it is a purple bolt that
         matches none of the other brand assets, and because browsers prefer an
         SVG icon it was winning over the real artwork in the tab. The
         favicon-32/48 PNGs are the same ribbon mark as the app logo.

         The ?v=3 on each entry is deliberate: browsers cache favicons far more
         aggressively than they revalidate HTML, so a new icon set does not
         reach an already-visited tab without a hard refresh. Bump the version
         whenever the icon artwork changes. -->
    <link rel="icon" href="/favicon-32.png?v=3" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-48.png?v=3" sizes="48x48" type="image/png" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" sizes="180x180" />

    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0f766e" />

    <title>Analytrix</title>
    <meta
      name="description"
      content="Upload a spreadsheet and get a dashboard, plain-language answers about your data, and predictions you can check."
    />

    <style>
      /* Paint the brand colour before React mounts, so a slow bundle does not
         flash the default white page on a dark-themed device. */
      html { background: #0a0a0a; }
      @media (prefers-color-scheme: light) { html { background: #ffffff; } }
      #root:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        background: #0a0a0a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

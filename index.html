<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Icons.

         The loader mark is the single source of truth for the app icon and
         brand artwork. -->
    <link rel="icon" href="/analytrix-loader.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0f766e" />

    <title>Analytrix</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <meta
      name="description"
      content="Upload a spreadsheet and get a dashboard, plain-language answers about your data, and predictions you can check."
    />

    <style>
      /* Paint the brand colour before React mounts, so a slow bundle does not
         flash the default white page on a dark-themed device. */
      html { background: #0a0a0a; }
      @media (prefers-color-scheme: light) { html { background: #ffffff; } }
      #root:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        background: #0a0a0a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
